            <section id="section-equally-likely">
                <h4>同様に確からしい</h4>
                <p>
                    　発展的な確率を学ぶためには、高校数学の "確率"　に関する問題点を明らかにする必要がある。
                    高校数学の "確率" は無定義用語としてして "試行" と "根元事象" を導入することから始まる。
                    そして "根元事象" 全体の集合を \( \Omega \) 、その部分集合を \( A \) とおいたとき、\( |A|/|\Omega| \) を \( A \) の起こる "確率" と言う。
                    
                </p>
            </section>

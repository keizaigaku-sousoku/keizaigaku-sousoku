<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>経済学総則 ｜ No fair value, just bid and ask.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="経済学総則（Keizaigaku Sousoku）とは、市場・投資、ミクロ・マクロ経済学、財務・ファイナンス理論等をフェア・バリューを排して記述したものです。">
    <meta name="keywords" content="経済学総則, Keizaigaku Sousoku, 市場, 投資, ミクロ経済学, マクロ経済学, 財務, ファイナンス, 確率, 統計学">
    <meta name="author" content="経済学総則">

    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+JP&family=Noto+Serif+JP:wght@400;700&family=Kaisei+Opti:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="共通/stylesheet_footer.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Noto Sans JP', sans-serif;
        }

        body { font-size: 16px; }

        header {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1e2f5b, #6967ab);/*#004898);*/
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            overflow: hidden;
        }

        .header-above {
            width: 100%;
            padding-bottom: 80px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            gap: 50px;
        }

        header h1 {
            font-family: 'Marcellus', serif;
            font-size: 50px;
            color: #fff;
            margin-top: 60px;
            margin-bottom: 60px;
            text-align: center;
        }

        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .header-above {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        .subtitle {
            font-family: 'Noto Serif JP', serif; /*'Kaisei Opti', serif;*/
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            line-height: 1;
        }

        .subtitle-box { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 300px; }

        .scroll-prompt { font-size: 15px; text-align: center; }
        .scroll-prompt p { color: #fff; }

        .arrow { text-align: center; animation: bounce 2s infinite; }
        .arrow .material-symbols-outlined { font-size: 50px; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        nav {
            bottom: 0;
            height: 80px;
            width: 100%;
            background-color: #ffffff26;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
        }

        nav a {
            color: #fff;
            padding: 8px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 15px;
            transition: transform 0.3s, background-color 0.3s, color 0.3s;
        }

        nav a:hover { background-color: #1e2f5b; color: #ffffff; transform: translateX(10px); }
        nav a:hover { background-color: #1e2f5b; color: #ffffff; transform: scale(1.05); }

        .nav-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; }
        .fixed-wrapper { position: fixed; top: 0; left: 0; width: 100%; z-index: 999; }
        .fixed-wrapper a { color: #1e2f5b; }

        h2 { font-size: 34px; font-weight: 700; line-height: 2; color: #1d1d1f; }
        p { line-height: 2; color: #1d1d1f; text-align: justify; }
        
        .jp-title {
            position: relative;
            display: inline-block;
            font-family: 'Noto Serif JP', serif;
            font-weight: 700;
            z-index: 1;
        }
        
        /* 背景英語 */
        .jp-title {
            position: relative;
        }
        
        .jp-title .en-bg {
            position: absolute;
            left: 50%;
            bottom: -0.35em;
            transform: translateX(-50%);
            font-family: 'Great Vibes', 'Marcellus', serif;
            font-size: 80px;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.03);
            z-index: -1;
        }

        .jp-title.en-navy .en-bg {
            color: rgba(30, 47, 91, 0.03); /* #1e2f5b 系の薄紺 */
        }
        
        .chapter-title { text-align: center; margin-top: 100px; margin-bottom: 50px; }
        
        .chapter-title h2 {
            font-size: 28px;
            font-family: 'Marcellus', serif;
            display: inline-block;
            font-weight: bold;
            color: #1e2f5b;
            letter-spacing: 0.3em;
        }

        .section {
            position: relative;
            width: 100%;
            overflow: hidden;
            padding: 80px 0;
        }

        .section-bg {
            position: absolute;
            inset: 0;
            background: #6967ab;
            clip-path: polygon(50% 10%, 100% 0%, 100% 90%, 50% 100%, 0% 90%, 0% 0%);
            z-index: 0;
        }

        .section-wrapper {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: center;
        }
        
        .section-wrapper .material-symbols-outlined { font-size: 50px; margin: 20px 0px; }

        .section-wrapper h2,
        .section-wrapper p,
        .section-wrapper .material-symbols-outlined {
            color: #1e2f5b;
        }

        /* 背景色があるセクション用の文字色 */
        .section .section-bg + .section-wrapper h2,
        .section .section-bg + .section-wrapper p,
        .section .section-bg + .section-wrapper .material-symbols-outlined {
            color: #fff;
        }

        /* section-wrapper 内のアニメーション対象 */
        .section-wrapper > * {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        /* 表示状態 */
        .section-wrapper > *.show {
            opacity: 1;
            transform: translateY(0);
        }

        .mobile-br { display: none; }

        @media (max-width: 768px) {
            body { font-size: 18px; }

            header { height: 100svh; }
            header h1 { font-size: 45px; text-align: left; margin-bottom: 30px; }

            .header-above { gap: 20px; }
            .subtitle { font-size: 15px; }
            .subtitle-box { height: auto; }
            .scroll-prompt { font-size: 13px; }

            nav { display: flex; align-items: center; justify-content: flex-start; overflow-x: auto; white-space: nowrap; gap: 8px; }
            nav::-webkit-scrollbar { display: none; }
            nav a { font-size: 16px; padding: 8px 16px; flex-shrink: 0; }

            h2 { font-size: 30px; }
            p { font-size: 16px; }

            .jp-title .en-bg {
                font-size: 45px;
                bottom: -0.2em;
            }
            
            .mobile-br { display: inline; }
        }
    </style>
</head>
<body>
    a
</body>
</html>
